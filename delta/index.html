<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پلن هفتگی دلتاکنکور</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{font-family:Vazirmatn,Tahoma,sans-serif;color:#17243b;background:#f3f6fc;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9dbfff;outline-offset:2px}.topbar{position:sticky;top:0;z-index:10;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid #e0e7f3}.top-inner{max-width:1150px;margin:auto;min-height:78px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:46px;height:46px;flex:none;border-radius:15px;background:linear-gradient(145deg,#123d9b,#3686f7);color:white;display:grid;place-items:center;font-size:24px;box-shadow:0 6px 16px #2563eb35}.brand h1{font-size:clamp(14px,2vw,20px);margin:0;line-height:1.5}.brand p{font-size:11px;color:#72819a;margin:2px 0 0}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid #dbe4f2;border-radius:11px;padding:10px 15px;background:white;color:#33435e;font-weight:700;font-size:12px;white-space:nowrap}.btn.primary{background:#2156c6;border-color:#2156c6;color:white}.btn.danger{color:#b42c4c;background:#fff3f5;border-color:#ffe0e5}.btn:hover{filter:brightness(.97)}.layout{max-width:1150px;margin:30px auto;padding:0 22px 50px}.intro{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.intro h2{font-size:23px;margin:0}.intro p{font-size:12px;color:#77849b;margin:4px 0}.status{font-size:11px;color:#237a59;background:#eaf9f1;padding:7px 12px;border-radius:30px;white-space:nowrap}.panel,.day{background:white;border:1px solid #e1e8f4;border-radius:18px;box-shadow:0 5px 22px #172c5210}.panel{padding:23px;margin-bottom:24px}.section-title{margin:0 0 18px;font-size:16px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.student-input{width:100%;padding:12px 14px;border:1px solid #dbe4ef;background:#f9fbfe;border-radius:11px;color:#17243b;min-width:0}.days{display:grid;gap:18px}.day{overflow:hidden}.day-head{background:linear-gradient(90deg,#eef4ff,#f8faff);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e6edf8}.day-title{display:flex;align-items:center;gap:10px;font-weight:800}.day-number{background:#245acb;color:white;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px}.day-caption{font-size:11px;color:#8591a6}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:17px}.slot{border:1px solid var(--border);background:var(--bg);border-radius:13px;padding:13px;min-width:0}.slot-title{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:9px}.slot textarea{display:block;width:100%;min-height:100px;height:100px;resize:vertical;border:0;background:transparent;color:#27374e;line-height:1.9;font-size:13px;outline:none;overflow:auto}.slot textarea::placeholder{color:#a1aabd}.morning{--border:#f7e1aa;--bg:#fffbf1;--accent:#a46a05}.afternoon{--border:#c8e5fa;--bg:#f1f9ff;--accent:#146caa}.slot:nth-child(6n+1){--border:#cbdcf9;--bg:#f2f7ff;--accent:#2057b2}.slot:nth-child(6n+2){--border:#ccebe6;--bg:#f1fbf8;--accent:#157a68}.slot:nth-child(6n+3){--border:#f4dfbc;--bg:#fffbf2;--accent:#996113}.slot:nth-child(6n+4){--border:#e2d5fa;--bg:#faf6ff;--accent:#7349ad}.slot:nth-child(6n+5){--border:#f4d5e2;--bg:#fff6fa;--accent:#a83d72}.slot:nth-child(6n+6){--border:#cde6f1;--bg:#f2fbff;--accent:#25728d}.footer{text-align:center;color:#8a96aa;font-size:11px;padding:25px}.overlay{position:fixed;inset:0;background:#0c1830a8;z-index:50;display:none;flex-direction:column}.overlay.open{display:flex}.modalbar{background:white;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.modalbar h2{font-size:15px;margin:0}.paper-scroll{overflow:auto;flex:1;padding:24px 12px}.paper{max-width:210mm;min-height:297mm;background:white;margin:auto;box-shadow:0 12px 45px #0004;padding:14mm}.print-root{font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl;color:#192a45}.print-header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid #2255b9;padding-bottom:14px;margin-bottom:14px}.print-logo{display:flex;align-items:center;gap:10px}.print-emblem{width:44px;height:44px;border-radius:12px;background:#2157be;color:white;display:grid;place-items:center;font-size:23px}.print-header h1{font-size:19px;margin:0}.print-subtitle{font-size:10px;color:#637b9f;margin:4px 0 0}.print-tag{font-size:10px;color:#2157be;font-weight:800}.print-student{display:flex;flex-direction:column;gap:8px;background:#eff5ff;border:1px solid #d7e5fc;border-radius:12px;padding:12px;margin-bottom:16px;font-size:11px;flex-wrap:wrap}.print-student>div{flex:none;min-width:0}.print-student strong{color:#174da8}.print-day{border:1px solid #dce5f1;border-radius:12px;margin-bottom:13px;break-inside:avoid;page-break-inside:avoid;overflow:hidden}.print-day-head{background:#1c3766;color:white;padding:9px 13px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:12px}.print-day-head small{font-size:9px;font-weight:400;color:#cddbf0}.print-slots{padding:10px;display:grid;gap:8px}.print-slot{display:grid;grid-template-columns:92px minmax(0,1fr);border:1px solid var(--border);border-radius:9px;background:var(--bg);overflow:hidden;break-inside:avoid}.print-slot-label{white-space:nowrap;padding:9px 10px;font-size:10px;font-weight:800;color:var(--accent);border-left:1px solid var(--border)}.print-slot-text{padding:9px 11px;font-size:11px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;min-height:36px}.print-empty{color:#9ca8b8}.print-footer{text-align:center;font-size:9px;color:#8795aa;border-top:1px solid #e3eaf3;padding-top:12px;margin-top:20px}.print-only{display:none}
@media(min-width:721px) and (max-width:980px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.top-inner{padding:10px 14px;flex-direction:column;align-items:stretch;gap:10px}.logo{width:36px;height:36px;font-size:19px;border-radius:11px}.brand{gap:9px}.brand h1{font-size:15px}.brand p{font-size:10px}.actions{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px}.btn{padding:9px 5px;font-size:10px}.layout{padding:0 12px 30px;margin-top:20px}.intro h2{font-size:18px}.panel{padding:16px}.fields{grid-template-columns:1fr}.slots{grid-template-columns:1fr;padding:12px}.slot textarea{min-height:76px;height:76px}.paper{padding:7mm}.modalbar{padding:10px;flex-wrap:wrap}.modalbar h2{font-size:12px}.print-header h1{font-size:15px}.print-slot{grid-template-columns:75px minmax(0,1fr)}}
@media print{@page{size:A4 portrait;margin:12mm}html,body{background:white!important}.topbar,.layout,.footer,.overlay{display:none!important}.print-only{display:block!important}.print-root{-webkit-print-color-adjust:exact;print-color-adjust:exact}.print-header{margin-top:0}.print-day{break-inside:avoid;page-break-inside:avoid}.print-slot{break-inside:avoid}.print-day-head{background:#1c3766!important;color:white!important}}
</style></head>
<body>
<header class="topbar"><div class="top-inner"><div class="brand"><div class="logo">✦</div><div><h1>پلن هفتگی دلتاکنکور</h1><p>سیستم تنظیم برنامه مشاوره تحصیلی</p></div></div><div class="actions"><button class="btn danger" id="resetBtn">پاک کردن</button><button class="btn" id="previewBtn">پیش‌نمایش</button><button class="btn primary" id="printBtn">چاپ / خروجی PDF</button></div></div></header>
<main class="layout"><div class="intro"><div><h2>برنامه‌ریزی هفتگی</h2><p>برای هر روز، شش پارت برنامه‌ریزی مستقل تنظیم کنید.</p></div><span class="status" id="saveStatus" role="status" aria-live="polite">آماده</span></div><section class="panel"><h2 class="section-title">مشخصات پلن هفتگی</h2><div class="fields"><div><label for="studentName">نام دانش‌آموز</label><input class="student-input" id="studentName" autocomplete="off" placeholder="مثال: علی محمدی"></div><div><label for="advisorName">مشاور تنظیم کننده پلن هفتگی</label><input class="student-input" id="advisorName" autocomplete="off" placeholder="نام و نام خانوادگی مشاور"></div></div></section><h2 class="section-title">جدول برنامه هفتگی</h2><div class="days" id="daysContainer"></div></main><footer class="footer">برنامه‌ریزی هفتگی دلتاکنکور • موفقیت، حاصل تداوم است.</footer>
<div class="overlay" id="previewModal" role="dialog" aria-modal="true" aria-label="پیش‌نمایش چاپ"><div class="modalbar"><h2>پیش‌نمایش برنامه هفتگی</h2><div class="actions"><button class="btn primary" id="printFromPreviewBtn">چاپ / PDF</button><button class="btn" id="closePreviewBtn">بستن ✕</button></div></div><div class="paper-scroll"><div class="paper" id="previewPaper"></div></div></div>
<div class="print-only" id="directPrintContent"></div>
<script>
'use strict';
const DAYS=[['sat','شنبه'],['sun','یکشنبه'],['mon','دوشنبه'],['tue','سه‌شنبه'],['wed','چهارشنبه'],['thu','پنجشنبه'],['fri','جمعه']];
const SLOTS=Array.from({length:6},(_,i)=>['part'+(i+1),['یک','دو','سه','چهار','پنج','شش'][i],'']);
const DB_NAME='DeltaKonkurSixPartWeeklyPlanDB', STORE='planData';
const $=id=>document.getElementById(id);
let db=null, pending=new Map(), saveTimer=null, saving=false, generation=0, resetInProgress=false;
function status(message){$('saveStatus').textContent=message}
function makeForm(){const frag=document.createDocumentFragment();DAYS.forEach(([id,title],i)=>{const card=document.createElement('article');card.className='day';const head=document.createElement('div');head.className='day-head';const dayTitle=document.createElement('div');dayTitle.className='day-title';const num=document.createElement('span');num.className='day-number';num.textContent=String(i+1);const name=document.createElement('span');name.textContent=title;dayTitle.append(num,name);const hint=document.createElement('span');hint.className='day-caption';hint.textContent='۶ پارت برنامه‌ریزی';head.append(dayTitle,hint);const slots=document.createElement('div');slots.className='slots';SLOTS.forEach(([slot,label,icon])=>{const box=document.createElement('div');box.className='slot '+slot;const heading=document.createElement('div');heading.className='slot-title';heading.textContent='پارت '+label;const area=document.createElement('textarea');area.id=`plan_${id}_${slot}`;area.setAttribute('aria-label',`پارت ${label} روز ${title}`);area.placeholder=`برنامه پارت ${label} روز ${title}...`;box.append(heading,area);slots.append(box)});card.append(head,slots);frag.append(card)});$('daysContainer').append(frag)}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return}const request=indexedDB.open(DB_NAME,1);request.onupgradeneeded=()=>{const database=request.result;if(!database.objectStoreNames.contains(STORE))database.createObjectStore(STORE,{keyPath:'id'})};request.onsuccess=()=>{db=request.result;db.onversionchange=()=>{db.close();db=null};resolve()};request.onerror=()=>reject(request.error)})}
function readAll(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const request=tx.objectStore(STORE).getAll();request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
function commitEntries(entries){return new Promise((resolve,reject)=>{if(!db){reject(new Error('Storage unavailable'));return}let tx;try{tx=db.transaction(STORE,'readwrite');const store=tx.objectStore(STORE);entries.forEach(([id,value])=>{if(value==='')store.delete(id);else store.put({id,value})});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)}catch(error){reject(error)}})}
async function flush(){clearTimeout(saveTimer);if(saving||resetInProgress||!pending.size)return;if(!db){status('ذخیره‌سازی در دسترس نیست');return}saving=true;const entries=[...pending];pending.clear();const token=generation;try{await commitEntries(entries);if(token!==generation)return;status(pending.size?'در انتظار ذخیره...':'ذخیره شد')}catch(err){console.error(err);if(token===generation){for(const [key,value] of entries)if(!pending.has(key))pending.set(key,value);status('خطا در ذخیره‌سازی')}}finally{saving=false;if(pending.size&&!resetInProgress&&db)saveTimer=setTimeout(flush,450)}}
function scheduleSave(id,value){pending.set(id,value);status('در حال ویرایش...');clearTimeout(saveTimer);saveTimer=setTimeout(flush,450)}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function printHTML(){const student=escapeHTML($('studentName').value.trim()||'—'),advisor=escapeHTML($('advisorName').value.trim()||'—');let result=`<div class="print-root"><div class="print-header"><div class="print-logo"><div class="print-emblem">✦</div><div><h1>پلن هفتگی دلتاکنکور</h1><p class="print-subtitle">نقشه راه مطالعه و پیشرفت تحصیلی</p></div></div><span class="print-tag">برنامه اختصاصی دانش‌آموز</span></div><div class="print-student"><div>مشاور تنظیم کننده پلن هفتگی: <strong>${advisor}</strong></div><div>نام دانش‌آموز: <strong>${student}</strong></div></div>`;DAYS.forEach(([id,title],i)=>{result+=`<section class="print-day"><div class="print-day-head"><span>${i+1} | ${title}</span><small>برنامه روزانه</small></div><div class="print-slots">`;SLOTS.forEach(([slot,label,icon])=>{const raw=$(`plan_${id}_${slot}`).value;result+=`<div class="print-slot ${slot}"><div class="print-slot-label">پارت ${label}</div><div class="print-slot-text">${raw.trim()?escapeHTML(raw):'<span class="print-empty">برنامه‌ای ثبت نشده</span>'}</div></div>`});result+='</div></section>'});return result+'<div class="print-footer">موفقیت، حاصل استمرار در اجرای برنامه است • دلتاکنکور</div></div>'}
function preview(){ $('previewPaper').innerHTML=printHTML();$('previewModal').classList.add('open')}
function closePreview(){$('previewModal').classList.remove('open')}
async function printPlan(){ $('directPrintContent').innerHTML=printHTML();closePreview();try{await document.fonts.ready}catch{}window.print()}
async function reset(){if(!confirm('تمام اطلاعات دانش‌آموز و ۴۲ پارت برنامه پاک شود؟'))return;resetInProgress=true;generation++;pending.clear();clearTimeout(saveTimer);try{if(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}document.querySelectorAll('#studentName,#advisorName,#daysContainer textarea').forEach(el=>el.value='');status('برنامه پاک شد');closePreview()}catch(err){console.error(err);status('خطا در پاک کردن اطلاعات')}finally{resetInProgress=false}}
async function init(){makeForm();document.addEventListener('input',event=>{const el=event.target;if(el.matches('#studentName,#advisorName,#daysContainer textarea'))scheduleSave(el.id,el.value)});$('resetBtn').onclick=reset;$('previewBtn').onclick=preview;$('closePreviewBtn').onclick=closePreview;$('printBtn').onclick=printPlan;$('printFromPreviewBtn').onclick=printPlan;$('previewModal').addEventListener('click',e=>{if(e.target===$('previewModal'))closePreview()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview()});document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});window.addEventListener('pagehide',()=>{flush()});try{await openDB();const records=await readAll();records.forEach(({id,value})=>{const el=$(id);if(el&&el.matches('#studentName,#advisorName,#daysContainer textarea')&&!pending.has(id))el.value=value});status('آماده و ذخیره‌شده')}catch(err){console.warn(err);status('حالت موقت؛ ذخیره‌سازی غیرفعال')}}
init();
</script></body></html>
